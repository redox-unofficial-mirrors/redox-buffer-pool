[package]
name = "redox-buffer-pool"
version = "0.6.0"
authors = ["4lDO2 <4lDO2@protonmail.com>"]
edition = "2024"
description = "A buffer pool library for Redox, featuring a general-purpose 32-bit allocator"
documentation = "https://docs.rs/redox-buffer-pool"
readme = "README.md"
homepage = "https://redox-os.org/"
repository = "https://gitlab.redox-os.org/redox-os/redox-buffer-pool.git"
license = "MIT"
keywords = ["redox", "buffer-pool"]
categories = ["data-structures", "memory-management"]
exclude = ["target"]

[features]
default = ["std"]
std = ["parking_lot", "guard-trait/default", "log/std", "spinning?/default"]
redox = ["redox_syscall"]

[dependencies]
guard-trait = { version = "0.4", default-features = false }
log = { version = "0.4", default-features = false }
parking_lot = { version = "0.12", features = ["nightly"], optional = true }
spinning = { version = "0.1", default-features = false, optional = true }
redox_syscall = { version = "0.9", optional = true }

[dev-dependencies]
rand = { version = "0.10", features = ["thread_rng"] }
parking_lot = { version = "0.12", features = ["nightly"] }
